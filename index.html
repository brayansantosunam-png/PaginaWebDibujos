<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="logotipo.ico" type="image/x-icon">
        <link rel="stylesheet" href="diseno.css">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
        <title>Bruma | Para Marco</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#FFFFFF99">

        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    </head>
    <body>

        <!--Welcome page-->
        <div id="welcome-overlay" class="welcome-overlay">
            <div class="welcome-container">
                <div class="welcome-image-side">

                    <div class="main-art-wrapper">
                        <video id="introVideo" class="welcome-main-img" autoplay muted playsinline>
                            <source src="video_intro.mp4" type="video/mp4">
                            Tu navegador no soporta videos.
                        </video>
                        
                        <img src="NadaquePerder.jpg" alt="Bruma Art" class="welcome-main-img" id="welcomeMainImg" style="display: none; opacity: 0;">
                    </div>

                </div>

                <div class="welcome-text-side">
                    <h1 class="welcome-title">BRUMA</h1>
                    <p class="welcome-subtitle">Bienvenido a la bruma de la <br> complejidad artística ...</p>
                    <button id="startBtn" class="welcome-btn">Vamos allá >></button>
                </div>
            </div>
        </div>
        <!--Switch estilo Material You-->
        <div class="switch-container">
            <input type="checkbox" id="themeSwitch" class="theme-switch" />
            <label for="themeSwitch" class="theme-switch-label">
                <span class="switch-track"></span>
                <span class="switch-thumb"></span>
            </label>
        </div>
        <!--Menú-->
        <header class="header-menu" id="header-menu">
            <nav class="nav container">
                <div class="nav__mobile-wrapper">

                    <div class="nav__menu" id="nav-menu">
                        <ul class="nav__list">
                            <div class="nav__indicator"></div>

                            <!-- Logo separado de las opciones -->
                            <div class="logo">
                                <a href="#">
                                    <img src="menu_bruma.png" alt="Logo Era Salud Activa" class="logo-img">
                                </a>
                            </div>

                            <li class="nav__item">
                                <a href="#Capitulo01" class="nav__link">
                                    <i class="ri-contrast-2-fill"></i>
                                <span>Capitulo 01</span>
                                </a>
                            </li>

                            <li class="nav__item">
                                <a href="#Capitulo02" class="nav__link">
                                    <i class="ri-music-2-fill"></i>
                                <span>Capitulo 02</span>
                                </a>
                            </li>

                        </ul>
                    </div>

                    <div class="nav__action-button">
                        <button class="action-btn" id="floatingButton1">
                        <i class="ri-spotify-fill"></i>
                    </div>

                </div>
            </nav>
        </header>
        <!--Capitulo 01-->
        <section id="Capitulo01" class="Capitulo01">
            
            <h1 class="Titulo-Web">Capitulo #01</h1>

            <div class="glass-panel">
            
                <div class="left-col">
                    <div class="video-container">
                        <video id="bgVideo" autoplay muted loop>
                            <source src="video.mp4" type="video/mp4">
                            Tu navegador no soporta videos.
                        </video>

                        <div id="typewriter-text" class="dynamic-text-overlay"></div>
                    </div>

                    <div class="seekbar-container">
                        <div class="range-wrapper">
                            <div class="track-wave" id="trackWave"></div>
                            <div class="track-straight"></div>
                            <input type="range" id="seekSlider" value="0" max="100" step="0.1">
                        </div>
                        <div class="time-info">
                            <span id="currentTime">0:00</span>
                            <span id="totalDuration">0:00</span>
                        </div>
                    </div>    

                    <div class="controls-container">
                        <div class="main-controls">
                            <button class="btn-nav" id="prevBtn">
                                <span class="material-symbols-outlined">skip_previous</span>
                            </button>
                            <button class="btn-play-pause" id="playBtn">
                                <span class="material-symbols-outlined" id="playIcon">play_arrow</span>
                            </button>
                            <button class="btn-nav" id="nextBtn">
                                <span class="material-symbols-outlined">skip_next</span>
                            </button>
                        </div>

                        <div class="sub-controls">
                            <button class="btn-sub" id="shuffleBtn" title="Aleatorio"><span class="material-symbols-outlined">shuffle</span></button>
                            <button class="btn-sub" id="repeatBtn" title="Repetir"><span class="material-symbols-outlined">repeat</span></button>
                            <button class="btn-sub" id="favBtn" title="Favorito"><span class="material-symbols-outlined">favorite</span></button>
                        </div>

                    </div>

                </div>

                <div class="playlist" id="playlist"></div>
            </div>

            <div id="original-carousel-slot">
                <div id="photo-container" class="photo-scroll"></div>
            </div>
            <h1 class="Descripcion-photo">Detrás de cámaras</h1>
            <div id="full-screen" class="full-screen">
                <img id="full-screen-img" src="" alt="Full Screen Image">
                <button id="close-full-screen">Cerrar</button>
            </div>

            <audio id="mainAudio"></audio>
        </section>
        <!--Capitulo 02-->
        <section id="Capitulo02" class="Capitulo02">
            <div class="banner-wrapper">
                <h1 class="Titulo-Web" id="Titulo-Web-Dos">Capitulo #02</h1>
                <picture>
                    <source media="(max-width: 768px)" srcset="banner_cap_dos_mobile.png">
                    <img id="banner-cap-dos" class="banner-cap-dos" src="banner_cap_dos.png" alt="Banner">
                </picture>
            </div>
            
            <div class="gallery-container">
                <div id="asymmetric-grid" class="asymmetric-grid">
                    </div>
            </div>

        </section>
        <!--Footer-->
        <footer class="footer">
            
            <div class="footer-logo">
                <img src="logotipo.ico" alt="Logo SAB" />
            </div>

            <div class="footer-copy">
                <p class="lang"
                    data-es="Mi portafolio® 2025 | Creado con HTML, CSS Y JS"
                    data-en="Oxitocina que inhibe el cortisol | Creado con HTML, CSS Y JS">
                    Para la mera verdura del caldo® 2026 | Creado con HTML, CSS Y JS
                </p>
            </div>
        </footer>

        <a href="https://open.spotify.com/playlist/7BYeqYLgLrG8iWPNu2L4PN" target="_blank" class="fab-btn spotify-fab">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify">
        </a>
       
        <!--Modo Ambiente-->
        <div id="ambient-overlay" class="ambient-overlay">
            <h2 class="ambient-title">
                Bruma
                <span id="ambient-dynamic-text" class="phrase-smaller"></span>
            </h2>
            <div id="ambient-carousel-wrapper"></div>
        </div>
        <script type="module" src="logica.js"></script> 
    </body>
</html>
